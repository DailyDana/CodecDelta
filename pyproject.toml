[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codecdelta"
version = "1.0.0"
description = "Measure and hear what a lossy encoder did to your audio"
requires-python = ">=3.11"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Daily Dana" }]

dependencies = [
    "numpy>=2.1",
    "PyQt6>=6.7",
    "pyqtgraph>=0.13",
    "Jinja2>=3.1",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
# Depo koku sys.path'e eklenir. Bu olmadan `pytest` ve `python -m pytest` farkli
# davranir: ikincisi calisma dizinini kendiliginden ekler, birincisi eklemez.
# Yerelde modul olarak, CI'da konsol betigi olarak cagrildigi icin fark ancak
# CI'da ortaya cikiyordu ("No module named 'app'"). Tek satirla ikisi esitlenir.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
markers = [
    "slow: gercek ffmpeg calistiran, saniyeler suren testler",
    "needs_ffmpeg: sistemde calisan bir ffmpeg+ffprobe ciftine ihtiyac duyar",
]

[tool.mypy]
# python_version BILEREK verilmiyor: numpy 2.5 stub'lari PEP 695 `type` ifadesi
# kullaniyor ve mypy bunu 3.12 altinda ayristiramiyor. Sozdizimi tabanini ruff'un
# target-version'i zorluyor (asagida py311); mypy calisan yorumlayiciyi kullanir.
files = ["app"]
strict = true
warn_return_any = true
disallow_untyped_defs = true
# numpy disindaki bazi bagimliliklarin stub'i yok; eksik stub hata sayilmaz
ignore_missing_imports = true

# PyQt6 stub'lari hemen her getter'i `X | None` isaretler (menuBar, style,
# horizontalHeader, mimeData...) ve bunlar kurulmus bir widget'ta None donmez.
# Her cagriyi assert'le sarmak gurultu olurdu; yalnizca bu hata kodu, yalnizca
# arayuz katmaninda kapali. Motor katmani tam strict kalir.
[[tool.mypy.overrides]]
module = "app.ui.*"
disable_error_code = ["union-attr"]

# pyqtgraph tipsiz; PlotWidget'tan turetmek "Any'den turetme" sayiliyor.
[[tool.mypy.overrides]]
module = "app.ui.widgets.charts"
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff kendi kurallari
    "PTH",      # os.path yerine pathlib
    "S",        # bandit: subprocess cagrilarini gozden gecirtir
]
ignore = [
    "S101",     # assert: testlerde ve ic tutarlilik kontrollerinde serbest
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PTH"]
# Kullaniciya gorunen metin: Turkce karakterler (i/I noktasiz), tipografik
# tire ve carpi isareti BILEREK. ASCII kurali kod ve yorumlar icin.
"app/ui/*" = ["RUF001"]
"app/report/*" = ["RUF001"]
"tests/test_ui.py" = ["S", "PTH", "RUF001"]
"tests/test_report.py" = ["S", "PTH", "RUF001"]
# Ceviri sozlugu ve stil sayfasi: uzun dizeler bolunmez.
"app/ui/i18n.py" = ["E501"]
"app/ui/theme.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
