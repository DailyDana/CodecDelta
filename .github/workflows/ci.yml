name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ayni dal icin ust uste kosu birikmesin; yenisi eskisini iptal etsin.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows-only: arac ffmpeg surec agacini taskkill ile oldurur ve QAudioSink
    # kullanir; Linux'ta yesil olmasi hicbir sey kanitlamaz.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Tests
        # needs_ffmpeg isaretli testler runner'da ffmpeg olmadigi icin atlanir;
        # yerel calistirmada kosarlar.
        run: pytest -q -m "not needs_ffmpeg"

  package:
    # Paketleme temiz bir makinede de calismali: build.ps1 PyInstaller yapisini
    # kurar ve exe'yi --smoke-test ile calistirir (runner'da ffmpeg ve ses
    # cihazi yok; bunlar uyari verir, surum ve rapor sablonu denetimi kesin).
    needs: check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build and smoke-test
        shell: pwsh
        run: ./tools/build.ps1 -Python (Get-Command python).Source

      - uses: actions/upload-artifact@v7
        with:
          name: CodecDelta-win64
          path: dist/CodecDelta-*-win64.zip
          if-no-files-found: error
